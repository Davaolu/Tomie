<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tofunmi 💖 My Valentine</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #5a0012, #8b0000);
    color: white;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}

.card {
    background: rgba(0,0,0,0.45);
    padding: 40px;
    border-radius: 25px;
    width: 90%;
    max-width: 420px;
    animation: fadeIn 0.8s ease;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}

h1 { font-size: 26px; }
p { font-size: 16px; line-height: 1.7; }

button {
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    margin-top: 15px;
    cursor: pointer;
    background: #c9184a;
    color: white;
}

/* HEARTS */
.heart {
    position: absolute;
    font-size: 22px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="card" id="content">
    <h1>💖 Tofunmi 💖</h1>
    <p>You make my heart smile without trying 🥰</p>
    <h1>Will you be my Valentine?</h1>
    <button onclick="sayYes()">Yes 💕</button>
    <button onclick="sayNo()">No 😢</button>
</div>

<script>
let page = 0;

const lovePages = [
`<h1>💞 My Love, Tofunmi 💞</h1>
<p>You walked into my life quietly, but you changed everything beautifully ❤️</p>`,

`<h1>🌹 Tofunmi 🌹</h1>
<p>Every thought of you feels warm, safe, and full of peace 😍</p>`,

`<h1>✨ My Favorite Person ✨</h1>
<p>Being with you feels like home, comfort, and happiness all in one 💑</p>`,

`<h1>💖 Forever Us 💖</h1>
<p>I don’t just want moments with you — I want a lifetime 💍</p>`,

`<h1>🥰 My Babe 🥰</h1>
<p>You make loving you feel easy, natural, and deeply real 💕</p>`,

/* FINAL PAGE */
`<h1>🥹 One Last Thing…</h1>
<p>
If this made you smile even a little,<br>
please call me or message me right now 🥺❤️
</p>
<p>
I just want to hear you say<br>
<strong>“I love you too”</strong> 💖
</p>
<button onclick="alert('Waiting for your call 🥹❤️')">📞 Call me now</button>
<button onclick="alert('I can’t wait to hear from you 🥰💬')">💬 Message me now</button>`
];

function sayNo() {
    document.getElementById("content").innerHTML = `
        <h1>🥺 Are you sure, Tofunmi?</h1>
        <p>My heart already belongs to you ❤️</p>
        <button onclick="sayYes()">Okay… Yes 😍</button>
    `;
}

function sayYes() {
    startHearts();
    nextPage();
}

function nextPage() {
    if (page < lovePages.length) {
        document.getElementById("content").innerHTML =
            lovePages[page] + `<button onclick="nextPage()">Next 💕</button>`;
        page++;
    }
}

function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (18 + Math.random() * 25) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }, 300);
}
</script>

</body>
  </html>
